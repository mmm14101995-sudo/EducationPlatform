name: Build Board APK

on:
  workflow_dispatch:

jobs:
  board-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make a separate board app (different app id, name and page)
        run: |
          mkdir -p board-build
          cp -r app settings.gradle.kts board-build/
          sed -i 's/applicationId = "com.education.platform"/applicationId = "com.education.board"/' board-build/app/build.gradle.kts
          sed -i 's/المنصة التعليمية/السبورة التفاعلية/' board-build/app/src/main/AndroidManifest.xml
          sed -i 's#/main/index.html"#/main/index_new_board.html"#' board-build/app/src/main/java/com/education/platform/MainActivity.kt
          mkdir -p board-build/app/src/main/assets
          cp index_new_board.html board-build/app/src/main/assets/index.html

      - name: Build board APK
        working-directory: board-build
        run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - uses: actions/upload-artifact@v4
        with:
          name: SmartBoard-apk
          path: board-build/app/build/outputs/apk/debug/app-debug.apk
