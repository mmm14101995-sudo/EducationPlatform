<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>المنصة التعليمية الشاملة للمرحلة الثانوية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        :root {
            --text: #f8fafc;
            --muted: rgba(248, 250, 252, 0.68);
            --card: rgba(15, 23, 42, 0.55);
            --line: rgba(255, 255, 255, 0.12);
            --accent: #38bdf8;
            --accent2: #818cf8;
            --solid: #0f172a;
        }
        [data-theme="light"] {
            --text: #0f172a;
            --muted: rgba(15, 23, 42, 0.66);
            --card: rgba(255, 255, 255, 0.72);
            --line: rgba(15, 23, 42, 0.1);
            --solid: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        html, body { height: 100%; }
        body { display: flex; overflow: hidden; color: var(--text); -webkit-tap-highlight-color: transparent; }
        button, input, select { font-family: inherit; }

        /* الخلفية */
        #bg-layer {
            position: fixed; inset: 0; z-index: -2;
            background-size: cover; background-position: center; background-color: #0b1020;
            transition: background-image 0.4s;
        }
        #bg-layer::after { content: ''; position: absolute; inset: 0; background: rgba(6, 10, 20, 0.5); }
        [data-theme="light"] #bg-layer::after { background: rgba(255, 255, 255, 0.7); }

        .ico { width: 22px; height: 22px; flex-shrink: 0; }

        .app { display: flex; width: 100%; height: 100%; padding: 14px; gap: 14px; }

        /* الشريط الجانبي */
        .sidebar {
            width: 262px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 18px;
            border-radius: 24px; background: var(--card); border: 1px solid var(--line);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; margin-bottom: 12px; }
        .brand .logo {
            width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        .teacher { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.06); margin-bottom: 10px; }
        .avatar {
            width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
            font-weight: 800; font-size: 20px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        .teacher h2 { font-size: 16px; font-weight: 800; }
        .teacher p { margin-top: 2px; font-size: 12px; color: var(--muted); }
        .nav {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; cursor: pointer;
            font-weight: 700; color: var(--muted); transition: 0.25s; user-select: none;
        }
        .nav:hover { background: rgba(255,255,255,0.07); color: var(--text); }
        .nav.active { background: rgba(255,255,255,0.1); color: var(--text); box-shadow: inset -3px 0 0 var(--accent); }
        .side-foot { margin-top: auto; display: flex; gap: 8px; }
        .btn-ghost {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 10px;
            border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.05);
            color: var(--text); font-weight: 700; cursor: pointer; font-size: 14px;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.12); }

        /* المحتوى */
        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px;
            border-radius: 20px; background: var(--card); border: 1px solid var(--line);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .topbar h1 { font-size: 20px; font-weight: 800; }
        .seg { display: flex; gap: 6px; padding: 5px; border-radius: 14px; background: rgba(255,255,255,0.07); border: 1px solid var(--line); }
        .seg button {
            padding: 8px 16px; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
            font-weight: 700; cursor: pointer; font-size: 14px;
        }
        .seg button.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.25); }

        .view { display: none; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 2px 24px; }
        .view.active { display: block; }
        #view-board.active { display: flex; flex-direction: column; overflow: hidden; }

        /* الرئيسية */
        .hero {
            padding: 30px; border-radius: 26px; border: 1px solid var(--line); position: relative; overflow: hidden;
            background: linear-gradient(120deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)), var(--card);
        }
        .hero::after {
            content: ''; position: absolute; left: -60px; bottom: -110px; width: 280px; height: 280px; border-radius: 50%;
            background: radial-gradient(circle, var(--accent), transparent 70%); opacity: 0.35; pointer-events: none;
        }
        .hero .kicker { color: var(--accent); font-weight: 700; font-size: 14px; margin-bottom: 6px; }
        .hero h2 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .hero p { color: var(--muted); font-size: 16px; line-height: 1.8; max-width: 640px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 18px 0; }
        .stat {
            padding: 18px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);
            display: flex; align-items: center; gap: 14px;
        }
        .stat .si {
            width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        .stat b { font-size: 26px; font-weight: 800; display: block; }
        .stat span { color: var(--muted); font-size: 13px; }
        .section-title { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px; gap: 10px; flex-wrap: wrap; }
        .section-title h3 { font-size: 19px; font-weight: 800; }
        .qa { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .qa-card {
            padding: 20px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
            font-weight: 700; color: var(--text); transition: 0.25s;
        }
        .qa-card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.2); }
        .qa-card .ico { width: 30px; height: 30px; color: var(--accent); }

        /* المكتبة (رفوف) */
        .lib-toolbar {
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px;
            border-radius: 18px; background: var(--card); border: 1px solid var(--line); margin-bottom: 22px;
        }
        .lib-toolbar .search {
            flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
            border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid var(--line);
        }
        .lib-toolbar .search input {
            flex: 1; border: 0; background: transparent; color: var(--text); padding: 10px 0; font-size: 15px; outline: none;
        }
        .lib-toolbar select {
            padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
            border: 1px solid var(--line); background: var(--solid); color: var(--text);
        }
        .shelf { margin-bottom: 34px; }
        .shelf-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .shelf-head h2 { font-size: 20px; font-weight: 800; }
        .shelf-count { font-size: 13px; color: var(--muted); }
        .shelf-head .btn-ghost { flex: 0 0 auto; margin-inline-start: auto; }
        body:not(.native) .import-btn { display: none; }
        .shelf-wood {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 22px;
            padding: 26px 22px 16px; min-height: 200px; border-radius: 18px; position: relative;
            background: linear-gradient(180deg, #3d2314 0%, #24140b 100%);
            border-bottom: 20px solid #5a351d;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.6), 0 12px 25px rgba(0,0,0,0.3);
        }
        .shelf-wood::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: -20px; height: 6px;
            background: linear-gradient(90deg, #1d0f07, #7c4826, #1d0f07);
        }
        .shelf-empty { grid-column: 1 / -1; color: #d6b98c; text-align: center; padding: 40px 10px; font-size: 15px; line-height: 1.9; }
        .book-card { display: flex; flex-direction: column; gap: 6px; cursor: pointer; color: #f5e6c8; min-width: 0; user-select: none; -webkit-user-select: none; }
        .cover {
            position: relative; width: 100%; height: 0; padding-bottom: 138.9%; overflow: hidden; background: #ffffff;
            border-radius: 4px 10px 10px 4px; box-shadow: -5px 6px 14px rgba(0,0,0,0.55); transition: transform 0.25s, box-shadow 0.25s;
        }
        .book-card:hover .cover { transform: translateY(-6px); box-shadow: -7px 12px 20px rgba(0,0,0,0.6); }
        .cover-fallback {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            padding: 10px; text-align: center; font-weight: 700; font-size: 14px; color: #222;
        }
        .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .book-title { font-size: 14px; font-weight: 700; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .book-meta { font-size: 12px; opacity: 0.8; }
        .progress { height: 4px; background: rgba(255,255,255,0.18); border-radius: 4px; overflow: hidden; }
        .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
        .book-card.done .progress i { background: #22c55e; }
        .book-card img { pointer-events: none; -webkit-user-drag: none; user-select: none; }
        body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
        .book-card.dragging { opacity: 0.45; }

        /* الاختبارات */
        .exam-card {
            padding: 20px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
            margin-bottom: 14px; display: flex; align-items: center; gap: 14px;
        }
        .exam-card .si {
            width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        .exam-card h3 { font-size: 16px; font-weight: 700; }
        .exam-card p { color: var(--muted); font-size: 13px; margin-top: 3px; }
        .exam-card { cursor: pointer; transition: 0.25s; }
        .exam-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(0,0,0,0.2); }
        .exam-card .exam-info { flex: 1; min-width: 0; }
        .exam-card .exam-info h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .exam-card .btn-ghost { flex: none; }
        .exam-empty { color: var(--muted); text-align: center; padding: 50px 10px; font-size: 15px; line-height: 1.9; }
        body.native .desk-only { display: none; }
        .add-exam {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            min-height: 120px; margin-bottom: 14px; border-radius: 18px; cursor: pointer;
            border: 2px dashed var(--accent); background: rgba(255,255,255,0.04); color: var(--text);
            font-weight: 800; font-size: 16px; transition: 0.25s; text-align: center; padding: 12px;
        }
        .add-exam:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .add-exam .plus {
            width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }
        .add-exam small { font-weight: 500; color: var(--muted
